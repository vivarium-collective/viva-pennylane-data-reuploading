title: Real-Data Validation — Loading and Classifying v2ecoli Zarr Stores

question: >
  Can the ZarrMultiOmicLoader correctly extract features from real v2ecoli
  zarr stores, and can the GenotypeToPhenotypeProcess classify phenotypes
  from this biologically realistic data?

objective: |
  Run a v2ecoli simulation with XArrayEmitter, load the zarr output with
  ZarrMultiOmicLoader, map observables to modality slots, and train the
  quantum classifier on real simulated multi-omic data.

hypothesis: >
  The ZarrMultiOmicLoader will correctly handle real v2ecoli zarr structure.
  The quantum classifier will achieve non-trivial accuracy (>0.65 AUC-ROC).

report:
  title: "Real-Data v2ecoli Validation"
  verdict: Not yet evaluated
  verdict_status: blocked
  key_metrics:
    - name: Loader Feature Count
      expected: ">= 3 modalities populated"
    - name: Classifier AUC-ROC
      expected: ">= 0.65"

study_card:
  goal: "Validate the end-to-end pipeline on real v2ecoli simulation data."
  mechanism: >
    Run a v2ecoli simulation with XArrayEmitter, load with
    ZarrMultiOmicLoader, train the GenotypeToPhenotypeProcess. Tests both
    the data loader's correctness on real zarr structure and the
    classifier's ability to extract signal from biologically realistic data.
  why_before_next: "Synthetic validation is necessary but not sufficient — real biological data has different structure and noise."
  expected_result: "Loader correctly extracts 3+ modalities; classifier AUC-ROC > 0.65."

description: >
  This study closes the loop from v2ecoli simulation to zarr store to
  ZarrMultiOmicLoader to GenotypeToPhenotypeProcess. It validates the
  loader handles real v2ecoli zarr structure (hive partitions, generation
  arrays, vector observables), the default modality map maps real
  observables correctly, and the quantum classifier can learn from
  biologically realistic data. Requires a v2ecoli simulation run with
  XArrayEmitter producing a zarr store.

baseline:
  - name: v2ecoli_real_data_load
    composite: pbg_pennylane_data_reuploading.composites.genotype_phenotype.genotype_to_phenotype_mapping
    params:
      num_omic_modalities: 4
      features_per_modality: 3
      epochs: 6
      batch_size: 8
      num_train: 12
      num_test: 12
      seed: 42
      noise_level: 0.1
      learning_rate: 0.4

parent_studies:
  - study: quantum-classifier-evaluation
    condition: ran

expected_behavior:
  - "ZarrMultiOmicLoader returns non-None for at least 3 modality paths from a real v2ecoli zarr store."
  - "GenotypeToPhenotypeProcess achieves AUC-ROC > 0.65 on features extracted from real v2ecoli data."

