[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pbg-pennylane-data-reuploading"
version = "0.1.0"
description = "Process-bigraph wrapper for PennyLane data-reuploading quantum classifier"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Alexander Patrie", email = "alexander@patrie.dev"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Quantum Computing",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=1.5.0",
    "pennylane>=0.35",
    "bigraph-viz2>=0.3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "matplotlib",
    "plotly",
    "bigraph-viz>=2.0.3",
    "pypdf>=4.0",
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "plotly"]

[tool.uv.sources]
# vivarium-workbench (the dashboard/publish CLI) isn't on PyPI — resolve it from
# git main so `uv sync` and the publish workflow can install it.
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }

# Allow the git-direct-reference dep above (vivarium-workbench @ git+https://…) —
# hatchling rejects direct references in metadata otherwise.
[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/vivarium-collective/pbg-pennylane-data-reuploading"
Issues = "https://github.com/vivarium-collective/pbg-pennylane-data-reuploading/issues"

[tool.hatch.build.targets.wheel]
packages = ["pbg_pennylane_data_reuploading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
